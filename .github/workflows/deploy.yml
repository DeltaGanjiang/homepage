name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Prepare deployment files
        shell: bash
        run: |
          set -Eeuo pipefail

          site_dir="${RUNNER_TEMP}/site"
          mkdir -p "$site_dir"

          rsync --archive \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='README.md' \
            --exclude='DEPLOYMENT.md' \
            "${GITHUB_WORKSPACE}/" \
            "${site_dir}/"

          test -f "${site_dir}/index.html"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_SSH_KEY:?Missing production secret DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing production secret DEPLOY_KNOWN_HOSTS}"

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "${HOME}/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/deploy_key" "${HOME}/.ssh/known_hosts"

          ssh-keygen -y -f "${HOME}/.ssh/deploy_key" > /dev/null
          ssh-keygen -l -f "${HOME}/.ssh/known_hosts"

      - name: Deploy with rsync
        shell: bash
        env:
          DEPLOY_HOST: 113.45.229.10
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: "22"
          DEPLOY_PATH: /home/ganjiang
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?Missing production variable DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing production variable DEPLOY_USER}"
          : "${DEPLOY_PORT:?Missing production variable DEPLOY_PORT}"
          : "${DEPLOY_PATH:?Missing production variable DEPLOY_PATH}"

          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'DEPLOY_HOST has an invalid format'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo 'DEPLOY_USER has an invalid format'; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'DEPLOY_PORT must be a number'; exit 1; }
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || { echo 'DEPLOY_PORT is out of range'; exit 1; }

          DEPLOY_PATH="${DEPLOY_PATH%/}"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$ ]] || { echo 'DEPLOY_PATH must be an absolute path with at least two segments'; exit 1; }

          ssh_options=(
            -i "${HOME}/.ssh/deploy_key"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh "${ssh_options[@]}" "$remote" \
            "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.ganjiang-deploy-target'"

          rsync \
            --archive \
            --compress \
            --checksum \
            --delete-delay \
            --delay-updates \
            --exclude='.ganjiang-deploy-target' \
            -e "ssh -i ${HOME}/.ssh/deploy_key -p ${DEPLOY_PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "${RUNNER_TEMP}/site/" \
            "${remote}:${DEPLOY_PATH}/"

          ssh "${ssh_options[@]}" "$remote" "test -f '$DEPLOY_PATH/index.html'"
